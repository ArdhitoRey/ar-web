<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Kuis Petualangan AR - Marker 8</title>

    <!-- A-Frame & MindAR -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <script src="./js/shaders.js"></script>

    <link rel="stylesheet" href="./style.css">
    <style>
        /* Quiz Specific Styling */
        :root {
            --quiz-cyan: #00e5ff;
            --quiz-green: #4caf50;
            --quiz-red: #ff5252;
            --quiz-dark: #0a192f;
        }

        /* Top Bar Layout */
        .quiz-top-bar {
            position: fixed;
            top: 20px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            z-index: 1200;
            pointer-events: none;
        }

        .quiz-top-bar > * {
            pointer-events: auto;
        }

        /* Quiz Navigation Pills */
        .quiz-nav-container {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(4, 14, 28, 0.82);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 6px 12px;
            border-radius: 30px;
            border: 1px solid rgba(0, 229, 255, 0.4);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
        }

        .quiz-nav-label {
            font-size: 12px;
            font-weight: 800;
            color: #94a3b8;
            margin-right: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .quiz-pill {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            font-size: 13px;
            font-weight: 700;
            color: #cbd5e1;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .quiz-pill:hover {
            background: rgba(0, 229, 255, 0.25);
            border-color: #00e5ff;
            color: #ffffff;
            transform: translateY(-2px);
        }

        .quiz-pill.active {
            background: linear-gradient(135deg, #00e5ff 0%, #00838f 100%);
            color: #051326;
            font-weight: 900;
            border-color: #ffffff;
            box-shadow: 0 0 16px rgba(0, 229, 255, 0.7);
            transform: scale(1.08);
        }

        /* Marker 8 Badge */
        .marker-badge {
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(0, 229, 255, 0.4);
            color: #e0f7fa;
            padding: 9px 16px;
            border-radius: 25px;
            font-size: 13px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
        }

        @media (max-width: 720px) {
            .quiz-top-bar {
                top: 14px;
                padding: 0 12px;
                flex-wrap: wrap;
                gap: 8px;
            }
            .quiz-nav-container {
                order: 3;
                margin: 6px auto 0;
                padding: 4px 10px;
            }
            .quiz-pill {
                width: 30px;
                height: 30px;
                font-size: 12px;
            }
            .quiz-nav-label {
                display: none;
            }
            .marker-badge {
                padding: 7px 12px;
                font-size: 12px;
            }
        }

        /* 2D Touch Choice Layer (Zero transition & Zero animation as requested) */
        .quiz-choice-touch-layer {
            position: fixed;
            inset: 0;
            z-index: 500;
            display: none;
            pointer-events: auto;
        }

        .quiz-choice-touch-layer.active {
            display: flex;
        }

        .touch-half {
            flex: 1;
            height: 100%;
            background: transparent;
            border: none;
            outline: none;
            cursor: pointer;
            padding: 0;
            margin: 0;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            /* ZERO transition & ZERO animation agar menyatu dengan video */
            transition: none !important;
            animation: none !important;
        }

        /* Result Popup Modal */
        .result-modal {
            position: fixed;
            inset: 0;
            z-index: 2000;
            background: rgba(4, 14, 28, 0.88);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .result-modal.active {
            display: flex;
            animation: modalPop 0.35s ease-out forwards;
        }

        @keyframes modalPop {
            from {
                opacity: 0;
                transform: scale(0.92);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .result-card {
            background: linear-gradient(160deg, #102a45 0%, #0a1b2e 100%);
            border-radius: 28px;
            border: 2px solid rgba(0, 229, 255, 0.5);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8), 0 0 35px rgba(0, 229, 255, 0.3);
            max-width: 480px;
            width: 100%;
            padding: 32px 28px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            color: #ffffff;
        }

        .result-card.card-correct {
            border-color: rgba(76, 175, 80, 0.85);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8), 0 0 35px rgba(76, 175, 80, 0.4);
        }

        .result-card.card-wrong {
            border-color: rgba(255, 82, 82, 0.85);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8), 0 0 35px rgba(255, 82, 82, 0.4);
        }

        .result-icon {
            font-size: 64px;
            line-height: 1;
            margin-bottom: 4px;
        }

        .result-title {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: 0.5px;
            margin: 0;
        }

        .result-desc {
            font-size: 16px;
            line-height: 1.5;
            color: #d1e8ff;
            margin: 0;
            max-width: 380px;
        }

        .result-actions {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            margin-top: 12px;
        }

        .btn-action {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 14px 20px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.25s ease;
        }

        .btn-action.btn-next {
            background: linear-gradient(135deg, #4caf50 0%, #2e7d32 100%);
            color: #ffffff;
            border-color: rgba(255, 255, 255, 0.4);
            box-shadow: 0 6px 20px rgba(76, 175, 80, 0.35);
        }

        .btn-action.btn-next:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(76, 175, 80, 0.5);
        }

        .btn-action.btn-replay {
            background: linear-gradient(135deg, #00e5ff 0%, #00838f 100%);
            color: #ffffff;
            border-color: rgba(255, 255, 255, 0.4);
            box-shadow: 0 6px 20px rgba(0, 229, 255, 0.35);
        }

        .btn-action.btn-replay:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 229, 255, 0.5);
        }

        .btn-action.btn-chapter {
            background: rgba(255, 255, 255, 0.15);
            color: #ffffff;
            border-color: rgba(255, 255, 255, 0.25);
        }

        .btn-action.btn-chapter:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: translateY(-2px);
        }

        .btn-action.btn-home {
            background: transparent;
            color: #90caf9;
            font-size: 14px;
            font-weight: 600;
        }

        .btn-action.btn-home:hover {
            color: #ffffff;
        }
    </style>

    <script>
        // Inisialisasi awal ID Kuis dari URL parameter (?quiz=1..5)
        const __params = new URLSearchParams(window.location.search);
        let __initialQuizId = parseInt(__params.get('quiz') || __params.get('id') || '1', 10);
        if (isNaN(__initialQuizId) || __initialQuizId < 1 || __initialQuizId > 5) __initialQuizId = 1;
        window.__CURRENT_QUIZ_ID__ = __initialQuizId;
        document.title = `Kuis Petualangan AR - Babak ${__initialQuizId} (Marker 8)`;

        // Register A-Frame Component for Reliable 3D Next Button Clicking
        if (typeof AFRAME !== 'undefined') {
            AFRAME.registerComponent('quiz-next-trigger', {
                init: function () {
                    const el = this.el;
                    const triggerNext = (evt) => {
                        if (evt) {
                            evt.stopPropagation();
                        }
                        console.log('🎯 [A-Frame Component] quiz-next-trigger berhasil diklik pada Marker 8!');
                        if (window.__triggerNextQuiz) {
                            window.__triggerNextQuiz();
                        }
                    };
                    el.addEventListener('click', triggerNext);
                    el.addEventListener('touchend', triggerNext);
                    el.addEventListener('mousedown', triggerNext);
                }
            });
        }
    </script>
</head>

<body>
    <!-- Top Navigation Bar -->
    <div class="quiz-top-bar">
        <!-- Back to Chapter 2 -->
        <a href="chapter2.html" class="back-button" style="position: static;">🔙 Bab 2</a>

        <!-- Quiz Selector Pills (1 - 5) -->
        <div class="quiz-nav-container" id="quizNavContainer">
            <span class="quiz-nav-label">Kuis:</span>
            <a href="./quiz.html?quiz=1" class="quiz-pill" data-quiz="1">1</a>
            <a href="./quiz.html?quiz=2" class="quiz-pill" data-quiz="2">2</a>
            <a href="./quiz.html?quiz=3" class="quiz-pill" data-quiz="3">3</a>
            <a href="./quiz.html?quiz=4" class="quiz-pill" data-quiz="4">4</a>
            <a href="./quiz.html?quiz=5" class="quiz-pill" data-quiz="5">5</a>
        </div>

        <!-- Marker 8 Badge -->
        <div class="marker-badge">
            <span>Target: Marker 8</span> 🎯
        </div>
    </div>

    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner"></div>
        <div class="loading-title" id="loadingTitle">Kuis Bawah Laut</div>
        <div class="loading-message" id="loadingMessage">Mempersiapkan Kamera AR & Kuis...</div>
        <div class="loading-progress" id="loadingProgress">●●</div>
        <div class="loading-detail" id="loadingDetail">Memuat video kuis & marker...</div>
        <div class="loading-tip">Pastikan izin kamera diaktifkan & arahkan ke Marker 8</div>
        <button class="start-button" id="startButton" disabled>Tunggu Sebentar...</button>
    </div>

    <!-- Status Bar -->
    <div class="status-bar" id="statusBar">Arahkan kamera ke Marker 8... 📷</div>

    <!-- Transparent 2D Hit Layer for Mobile Touch (Zero animation/Zero latency at 9.25s) -->
    <div class="quiz-choice-touch-layer" id="quizTouchLayer">
        <!-- Left half -->
        <button class="touch-half" id="btnTouchLeft" aria-label="Pilih Kiri"></button>
        <!-- Right half -->
        <button class="touch-half" id="btnTouchRight" aria-label="Pilih Kanan"></button>
    </div>

    <!-- Result Popup Modal (Disederhanakan / Fallback) -->
    <div class="result-modal" id="resultModal">
        <div class="result-card" id="resultCard">
            <div class="result-icon" id="resultIcon">🎉</div>
            <h2 class="result-title" id="resultTitle">Hebat Sekali!</h2>
            <p class="result-desc" id="resultDesc">
                Jawabanmu benar!
            </p>
            <div class="result-actions">
                <button class="btn-action btn-next" id="btnNextQuiz" style="display: none;">
                    ➡️ Lanjut ke Kuis Selanjutnya
                </button>
                <button class="btn-action btn-replay" id="btnReplayQuiz">
                    🔄 Ulangi Kuis
                </button>
                <a href="./chapter2.html" class="btn-action btn-chapter">
                    📖 Kembali ke Cerita (Bab 2)
                </a>
                <a href="./index.html" class="btn-action btn-home">
                    🏠 Halaman Utama
                </a>
            </div>
        </div>
    </div>

    <!-- AR Scene Tracking Marker 8 (targetIndex: 7) -->
    <a-scene id="arScene" mindar-image="
            imageTargetSrc: ./targets-mind/targets-chapter2.mind;
            filterMinCF: 0.0001;
            filterBeta: 0.001;
            warmupTolerance: 3;
            missTolerance: 5;
            maxTrack: 8;
        " color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights: true, antialias: true"
        vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">

        <a-camera position="0 0 0" look-controls="enabled: false" cursor="rayOrigin: mouse" raycaster="objects: .clickable"></a-camera>

        <!-- Target Index 7 corresponds to Marker 8 in Chapter 2 targets -->
        <a-entity id="targetQuiz" mindar-image-target="targetIndex: 7">
            <a-entity id="video-container-quiz" visible="false">
                <!-- Question Banner -->
                <a-image id="quiz-pertanyaan" src="#img-quiz-pertanyaan" position="0 0 0.12" height="1" width="1"
                    material="transparent: true; alphaTest: 0.05; side: double"></a-image>

                <!-- Video Benar: card video (Ungu/Magenta di semua quiz) -->
                <a-video id="video-quiz-benar" class="clickable" src="#vid-quiz-benar" position="0 0 0.10" height="1" width="1"
                    material="shader: chromakey-magenta; src: #vid-quiz-benar; transparent: true; side: double"></a-video>

                <!-- Video Salah: card video (Green di quiz 1,2,4; Magenta di quiz 3,5) -->
                <a-video id="video-quiz-salah" class="clickable" src="#vid-quiz-salah" position="0 0 0.11" height="1" width="1"
                    material="shader: chromakey-advanced; src: #vid-quiz-salah; transparent: true; side: double"></a-video>

                <!-- 3D Choice Clickable Planes (Active at 9.25s) -->
                <!-- Left card 3D plane -->
                <a-plane id="btn-choice-left-3d" class="clickable" position="-0.20 -0.012 0.20" width="0.36" height="0.30"
                    material="opacity: 0.0; transparent: true" visible="false"></a-plane>

                <!-- Right card 3D plane -->
                <a-plane id="btn-choice-right-3d" class="clickable" position="0.20 -0.012 0.20" width="0.36" height="0.30"
                    material="opacity: 0.0; transparent: true" visible="false"></a-plane>

                <!-- 3D Next Button (Muncul di bawah kartu Benar & Salah saat memilih Benar dan bergerak mengikuti Marker 8) -->
                <a-image id="btn-next-quiz-3d" class="clickable" quiz-next-trigger src="#img-quiz-next-btn" position="0 -0.38 0.22" height="0.25" width="0.25"
                    material="transparent: true; opacity: 0; alphaTest: 0.01; side: double; depthWrite: false" visible="false"
                    animation__fade="property: material.opacity; from: 0; to: 1; dur: 600; easing: easeOutCubic; startEvents: trigger-fade-in"
                    animation__scale="property: scale; from: 0.2 0.2 0.2; to: 1 1 1; dur: 650; easing: easeOutBack; startEvents: trigger-fade-in"
                    animation__pulse="property: scale; dir: alternate; dur: 850; easing: easeInOutSine; loop: true; to: 1.10 1.10 1; startEvents: trigger-pulse-start"></a-image>

                <!-- Transparent hit plane for 3D Next Button (High touch responsiveness) -->
                <a-plane id="btn-next-plane-3d" class="clickable" quiz-next-trigger position="0 -0.38 0.24" width="0.36" height="0.32"
                    material="opacity: 0.001; transparent: true; depthWrite: false" visible="false"></a-plane>
            </a-entity>
        </a-entity>

        <a-assets>
            <img id="img-quiz-pertanyaan" src="./compressed_ultra-videos/chapter2/quiz/quiz1/pertanyaan.PNG" crossorigin="anonymous" />
            <img id="img-quiz-next-btn" src="./addon-image/quiz/next-button-crop.png" crossorigin="anonymous" />
            <video id="vid-quiz-benar" preload="auto" crossorigin="anonymous" playsinline webkit-playsinline muted></video>
            <video id="vid-quiz-salah" preload="auto" crossorigin="anonymous" playsinline webkit-playsinline muted></video>

            <!-- Audio Voiceover Kuis -->
            <audio id="sound-quiz-pertanyaan" src="./compressed_ultra-videos/chapter2/quiz/quiz1/sound/pertanyaan.mp3" preload="auto"></audio>
            <audio id="sound-quiz-benar" src="./compressed_ultra-videos/chapter2/quiz/quiz1/sound/benar.mp3" preload="auto"></audio>
            <audio id="sound-quiz-salah" src="./compressed_ultra-videos/chapter2/quiz/quiz1/sound/salah.mp3" preload="auto"></audio>
        </a-assets>
    </a-scene>

    <script>
        // Update shader attribute for video-quiz-salah immediately based on current quiz ID
        (function() {
            const qId = window.__CURRENT_QUIZ_ID__ || 1;
            const salahShader = (qId === 3 || qId === 5) ? 'chromakey-magenta' : 'chromakey-advanced';
            const vidSalahEl = document.getElementById('video-quiz-salah');
            if (vidSalahEl) {
                vidSalahEl.setAttribute('material', `shader: ${salahShader}; src: #vid-quiz-salah; transparent: true; side: double`);
            }
            // Highlight active navigation pill
            const activePill = document.querySelector(`.quiz-pill[data-quiz="${qId}"]`);
            if (activePill) activePill.classList.add('active');
        })();
    </script>

    <script type="module" src="./js/quiz.js"></script>
</body>

</html>
